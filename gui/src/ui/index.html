<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linuxwolf</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><img src="icon.png" alt=""><span>Linuxwolf</span></div>
    <nav>
      <button data-page="library" class="active"><span class="i">▦</span>Library</button>
      <button data-page="games"><span class="i">◈</span>Games<span class="pill" id="nav-running" hidden></span></button>
      <button data-page="overlay"><span class="i">◧</span>Overlay</button>
      <button data-page="activity"><span class="i">≡</span>Activity<span class="pill busy" id="nav-tasks" hidden></span></button>
      <button data-page="settings"><span class="i">⚙</span>Settings</button>
    </nav>
    <div class="now" id="now-playing"></div>
  </aside>
  <main>
    <section id="page-library" class="page active"></section>
    <section id="page-games" class="page"></section>
    <section id="page-overlay" class="page"></section>
    <section id="page-activity" class="page"></section>
    <section id="page-settings" class="page"></section>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
